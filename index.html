<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Water Quest</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <img class="brand-logo" src="img/cw_logo_horizontal.png" alt="charity: water" />
    <h1>Water Quest</h1>
    <p class="game-instructions">Collect 20 items to complete the game!</p>
    <div class="stats">
      <p>Cans Collected: <span id="current-cans">0</span></p>
      <p>Time Left: <span id="timer">30</span>s</p>
    </div>
    <div class="game-grid"></div>
    <button id="start-game">Start Game</button>
  </div>
  <dialog id="results-dialog" class="results-dialog" aria-labelledby="results-title">
    <div class="results-icon" aria-hidden="true">💧</div>
    <h2 id="results-title"></h2>
    <p id="results-message"></p>
    <p class="results-score">Your score: <span id="results-score"></span></p>
    <button id="close-results" type="button">Close</button>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
